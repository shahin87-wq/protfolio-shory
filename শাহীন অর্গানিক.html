function sec(t,b,cls){return '<section class="'+(cls||"")+' px-4 py-10"><div class="max-w-5xl mx-auto"><h2 class="sf font-extrabold text-2xl sm:text-3xl tx-d mb-6">'+t+'</h2>'+b+'</div></section>'}
function render(){
 var p=P[cur],r=document.documentElement.style;
 r.setProperty("--d",p.d);r.setProperty("--m",p.m);r.setProperty("--l",p.l);r.setProperty("--a",p.a);
 document.title=p.n+" – শাহীন অর্গানিক";
 document.getElementById("chips").innerHTML=P.map(function(q,i){return '<button class="chip'+(i==cur?' on':'')+'" onclick="go('+i+')">'+q.e+' '+q.n+'</button>'}).join("");
 var pk=p.pk[sel],h='';
 h+='<section class="px-4 pt-8 pb-12"><div class="max-w-5xl mx-auto grid md:grid-cols-2 gap-8 items-center">'+
 '<div class="order-2 md:order-1"><p class="font-semibold tx-a">'+p.n+' · সরাসরি উৎস থেকে</p>'+
 '<h1 class="sf font-extrabold tx-d text-3xl sm:text-5xl leading-tight mt-2">'+p.h+'</h1>'+
 '<p class="mt-4 text-lg max-w-md">'+p.s+'</p>'+
 '<div class="mt-6 flex flex-wrap gap-3 items-center"><a href="#order" class="btn">অর্ডার করুন</a><a href="#genuine" class="chip">খাঁটি চিনবেন যেভাবে</a></div>'+
 '<p class="mt-4 text-sm opacity-80">ক্যাশ অন ডেলিভারি · সারা বাংলাদেশে ডেলিভারি</p></div>'+
 '<div class="order-1 md:order-2 flex justify-center relative"><div class="orb" role="img" aria-label="'+p.n+'">'+p.e+'</div><span class="sm-orb" style="top:4%;left:6%">🌿</span><span class="sm-orb" style="bottom:6%;right:4%">🌾</span></div></div></section>';
 h+=sec("কোথা থেকে আসে, কীভাবে তৈরি",'<p class="max-w-2xl mb-5">'+p.o+'</p><div class="grid sm:grid-cols-3 gap-4">'+p.pr.map(function(t,i){return '<div class="card p-5"><div class="sf font-extrabold text-2xl tx-a">ধাপ '+bn(i+1)+'</div><p class="mt-1">'+t+'</p></div>'}).join("")+'</div>');
 h+=sec("খাঁটি চেনার উপায়",'<ul class="card p-5 grid sm:grid-cols-2 gap-3">'+list(p.g,"✅")+'</ul>','" id="genuine');
 h+=sec("কেন আপনার প্রয়োজন",'<ul class="grid sm:grid-cols-2 gap-3">'+p.b.map(function(t){return '<li class="card p-4 font-medium">'+t+'</li>'}).join("")+'</ul>');
 h+=sec("কারা কিনবেন, কারা কিনবেন না",'<div class="grid sm:grid-cols-2 gap-4"><div class="card p-5"><h3 class="font-bold mb-2 tx-d">কিনতে পারেন</h3><ul class="space-y-2">'+list(p.y,"👍")+'</ul></div><div class="card p-5"><h3 class="font-bold mb-2 tx-d">সতর্কতা</h3><ul class="space-y-2">'+list(p.no,"⚠️")+'</ul></div></div>');
 h+=sec("বাজারের ভেজাল বনাম আমাদের "+p.n,'<div class="card overflow-hidden"><div class="row bd font-bold text-center"><div class="p-3" style="background:#8a2f2f">বাজারে ভেজাল</div><div class="p-3">শাহীন অর্গানিক</div></div>'+p.df.map(function(x){return '<div class="row" style="background:color-mix(in srgb,var(--d) 12%,transparent)"><div class="bg-white p-3">❌ '+x[0]+'</div><div class="bg-white p-3">✅ '+x[1]+'</div></div>'}).join("")+'</div>');
 h+=sec("কোয়ালিটি নিশ্চয়তা",'<div class="bd rounded-2xl p-6 grid sm:grid-cols-3 gap-4 text-center"><div><div class="text-3xl">🔍</div><b>ভেজাল প্রমাণিত হলে</b><p class="opacity-90 text-sm">পুরো টাকা ফেরত</p></div><div><div class="text-3xl">📦</div><b>নিরাপদ প্যাকেজিং</b><p class="opacity-90 text-sm">ভাঙা বা লিক হলে বদলে দেব</p></div><div><div class="text-3xl">🤝</div><b>আগে দেখে, পরে টাকা</b><p class="opacity-90 text-sm">ক্যাশ অন ডেলিভারি</p></div></div>');
 h+=sec("প্যাকেজ ও দাম",'<div class="grid sm:grid-cols-3 gap-4">'+p.pk.map(function(k,i){return '<button class="pk card p-5 text-left'+(i==sel?' sel':'')+'" onclick="pick('+i+')" aria-pressed="'+(i==sel)+'"><div class="font-bold text-lg">'+k[0]+'</div><div class="sf font-extrabold text-2xl tx-a">'+money(k[1])+'</div><div class="text-sm opacity-70 line-through">'+money(k[2])+'</div><div class="mt-1 text-sm font-semibold" style="color:#1b7a3a">সাশ্রয় '+money(k[2]-k[1])+'</div></button>'}).join("")+'</div>'+
 '<p class="mt-4 card p-4"><b>অফার:</b> ২টি প্যাকেজ একসাথে নিলে ডেলিভারি চার্জ ফ্রি। ঢাকায় ১–২ দিন, ঢাকার বাইরে ২–৪ দিনে পৌঁছে যাবে।</p>');
 h+=sec("গ্রাহকরা যা বলছেন",'<div class="grid sm:grid-cols-2 gap-4">'+p.rv.map(function(v){return '<figure class="card p-5"><div>⭐⭐⭐⭐⭐</div><blockquote class="mt-2">'+v[2]+'</blockquote><figcaption class="mt-3 font-semibold tx-d">'+v[0]+', <span class="opacity-70 font-normal">'+v[1]+'</span></figcaption></figure>'}).join("")+'</div><p class="text-xs opacity-60 mt-2">নমুনা রিভিউ, আসল গ্রাহকদের মতামত দিয়ে বদলে নিন।</p>');
 h+=sec("সাধারণ প্রশ্ন",'<div class="space-y-3">'+p.f.map(function(q){return '<details class="card p-4"><summary>'+q[0]+'</summary><p class="mt-2">'+q[1]+'</p></details>'}).join("")+'</div>');
 h+='<section id="order" class="px-4 py-12"><div class="max-w-xl mx-auto bd rounded-3xl p-6 text-center"><h2 class="sf font-extrabold text-2xl">আজই '+p.n+' অর্ডার করুন</h2><p class="mt-2 opacity-90">নির্বাচিত: <b>'+pk[0]+' · '+money(pk[1])+'</b></p><a id="ob" class="btn mt-5 w-full" target="_blank" rel="noopener" href="'+wa(p,pk)+'">অর্ডার করুন</a><p class="text-xs opacity-70 mt-3">হোয়াটসঅ্যাপে নাম, ঠিকানা ও ফোন নম্বর পাঠান। ক্যাশ অন ডেলিভারি।</p></div></section>';
 h+=sec("আমাদের অন্য পণ্য",'<div class="grid grid-cols-2 sm:grid-cols-4 gap-3">'+P.map(function(q,i){return i==cur?'':'<button class="card p-4 text-center" onclick="go('+i+')"><div class="text-5xl">'+q.e+'</div><div class="font-bold mt-1" style="color:'+q.d+'">'+q.n+'</div></button>'}).join("")+'</div>');
 document.getElementById("app").innerHTML=h;
}
function wa(p,k){return "https://wa.me/"+WA+"?text="+encodeURIComponent("আসসালামু আলাইকুম, আমি "+p.n+" ("+k[0]+") অর্ডার করতে চাই।")}
function go(i){cur=i;sel=1;render();window.scrollTo({top:0})}
function pick(i){sel=i;var y=window.scrollY;render();window.scrollTo(0,y)}
render();
</script>
</body>
</html>
